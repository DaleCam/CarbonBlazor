name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: OIDC token for NuGet trusted publishing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify version and changelog
        run: |
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' CarbonBlazor/CarbonBlazor.csproj)
          echo "csproj version: $CSPROJ_VERSION"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag version: $TAG_VERSION"
            if [[ "$TAG_VERSION" != "$CSPROJ_VERSION" ]]; then
              echo "::error::Tag v$TAG_VERSION does not match <Version>$CSPROJ_VERSION</Version> in CarbonBlazor.csproj"
              exit 1
            fi
          fi

          CHANGELOG_VERSION=$(grep -oPm1 '(?<=^## v)[0-9][^ ]*' CHANGELOG.md)
          echo "changelog version: $CHANGELOG_VERSION"
          if [[ "$CHANGELOG_VERSION" != "$CSPROJ_VERSION" ]]; then
            echo "::error::CHANGELOG.md latest entry (v$CHANGELOG_VERSION) does not match <Version>$CSPROJ_VERSION</Version> in CarbonBlazor.csproj"
            exit 1
          fi

      - name: Restore
        run: dotnet restore CarbonBlazor.slnx

      - name: Test
        run: dotnet test CarbonBlazor.slnx --configuration Release

      - name: Pack
        run: dotnet pack CarbonBlazor/CarbonBlazor.csproj --configuration Release --no-restore --output artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org username (profile name), NOT email

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
